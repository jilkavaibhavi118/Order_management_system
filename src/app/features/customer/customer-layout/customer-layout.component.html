<div class="customer-shell">
  <header class="customer-header">
    <div class="header-inner">
      <!-- Brand Logo -->
      <a class="brand-wrap" routerLink="/shop" aria-label="OrderFlow home">
        <span class="brand-mark">
          <i class="pi pi-box" aria-hidden="true"></i>
        </span>
        <div class="brand-titles">
          <span class="brand-name">OrderFlow</span>
          <span class="brand-badge">MARKETPLACE</span>
        </div>
      </a>

      <!-- Navigation Links -->
      <nav class="customer-nav" aria-label="Customer navigation">
        <a
          routerLink="/shop"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          aria-label="Shop Catalog"
        >
          <i class="pi pi-th-large" aria-hidden="true"></i>
          <span class="nav-label">Shop Catalog</span>
        </a>
        <a routerLink="/cart" routerLinkActive="active" class="cart-link" aria-label="My Cart">
          <i class="pi pi-shopping-bag" aria-hidden="true"></i>
          <span class="nav-label">My Cart</span>
          @if (cartCount() > 0) {
            <span class="cart-badge" aria-label="{{ cartCount() }} items in cart">{{ cartCount() }}</span>
          }
        </a>
        <a routerLink="/my-orders" routerLinkActive="active" aria-label="Order History">
          <i class="pi pi-receipt" aria-hidden="true"></i>
          <span class="nav-label">Order History</span>
        </a>
      </nav>

      <!-- User Profile & Action Menu -->
      <div class="header-actions">
        @if (isAuthenticated()) {
          <button
            #accountButton
            pButton
            type="button"
            class="account-button"
            aria-label="Open account menu"
            aria-haspopup="true"
            [text]="true"
            [rounded]="true"
            (click)="accountPopover.toggle($event, accountButton)"
          >
            <span class="account-avatar">{{ accountInitial() }}</span>
            <span class="account-meta">
              <span class="account-name">{{ accountName() }}</span>
              <span class="account-role">Customer</span>
            </span>
            <i class="pi pi-chevron-down account-chevron" aria-hidden="true"></i>
          </button>
        } @else {
          <a pButton routerLink="/login" class="header-login-button" [outlined]="true" aria-label="Sign in">
            <i class="pi pi-sign-in" pButtonIcon aria-hidden="true"></i>
            <span pButtonLabel>Sign in</span>
          </a>
          <a pButton routerLink="/register" class="header-register-button" aria-label="Create account">
            <i class="pi pi-user-plus" pButtonIcon aria-hidden="true"></i>
            <span pButtonLabel>Create account</span>
          </a>
        }
      </div>
    </div>
  </header>

  <main class="customer-main">
    <router-outlet></router-outlet>
  </main>

  <p-toast position="top-right" />

  <p-popover #accountPopover styleClass="modern-account-popover">
    @if (isAuthenticated()) {
      <div class="account-popover-content">
        <div class="popover-header">
          <span class="popover-avatar">{{ accountInitial() }}</span>
          <div class="popover-user-details">
            <strong>{{ accountName() }}</strong>
            <span class="badge-customer">Customer account</span>
          </div>
        </div>

        <div class="popover-divider"></div>

        <div class="popover-actions">
          <a routerLink="/profile" (click)="accountPopover.hide()" class="popover-item">
            <i class="pi pi-user" aria-hidden="true"></i>
            <span>My Profile</span>
          </a>
          <a routerLink="/my-orders" (click)="accountPopover.hide()" class="popover-item">
            <i class="pi pi-receipt" aria-hidden="true"></i>
            <span>View All Past Orders</span>
          </a>
          <a routerLink="/shop" (click)="accountPopover.hide()" class="popover-item">
            <i class="pi pi-shopping-bag" aria-hidden="true"></i>
            <span>Continue Shopping</span>
          </a>
        </div>

        <div class="popover-divider"></div>

        <p-button
          label="Sign Out"
          icon="pi pi-sign-out"
          severity="danger"
          [outlined]="true"
          styleClass="popover-logout-btn"
          (onClick)="logout(accountPopover)"
        />
      </div>
    }
  </p-popover>
</div>
