<div class="customer-shell">
  <header class="cx-header">
    <div class="cx-header__inner">
      <button type="button" class="cx-brand" routerLink="/shop" aria-label="OrderFlow home">
        <span class="cx-brand__mark"><i class="pi pi-box" aria-hidden="true"></i></span>
        <span class="cx-brand__name">OrderFlow</span>
      </button>

      <nav class="cx-nav" aria-label="Customer navigation">
        <button type="button" routerLink="/shop" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">
          <i class="pi pi-th-large" aria-hidden="true"></i>
          <span>Shop</span>
        </button>
        <button type="button" routerLink="/cart" routerLinkActive="is-active">
          <i class="pi pi-shopping-cart" aria-hidden="true"></i>
          <span>Cart</span>
          @if (cartCount() > 0) {
            <span class="cx-nav__badge" [attr.aria-label]="cartCount() + ' items in cart'">{{ cartCount() }}</span>
          }
        </button>
        <button type="button" routerLink="/my-orders" routerLinkActive="is-active">
          <i class="pi pi-receipt" aria-hidden="true"></i>
          <span>My orders</span>
        </button>
      </nav>

      <div class="cx-header__actions">
        @if (isAuthenticated()) {
          <button
            #accountButton
            type="button"
            class="cx-account"
            aria-label="Open account menu"
            aria-haspopup="true"
            (click)="accountPopover.toggle($event, accountButton)"
          >
            <span class="cx-avatar">{{ accountInitial() }}</span>
            <span class="cx-account__name">{{ accountName() }}</span>
            <i class="pi pi-chevron-down" aria-hidden="true"></i>
          </button>
        } @else {
          <button type="button" routerLink="/login" class="cx-btn cx-btn--secondary">Sign in</button>
          <button type="button" routerLink="/register" class="cx-btn cx-btn--primary">Create account</button>
        }
      </div>
    </div>
  </header>

  <main class="cx-main">
    <router-outlet></router-outlet>
  </main>

  <footer class="cx-footer">
    <div class="cx-footer__inner">
      <span>&copy; {{ year }} OrderFlow</span>
      <span>Secure checkout &middot; Live stock availability</span>
    </div>
  </footer>

  <p-toast position="top-right" />

  <p-popover #accountPopover styleClass="cx-account-popover">
    @if (isAuthenticated()) {
      <div class="cx-menu">
        <div class="cx-menu__head">
          <span class="cx-avatar">{{ accountInitial() }}</span>
          <div>
            <strong>{{ accountName() }}</strong>
            <span>Customer account</span>
          </div>
        </div>
        <button type="button" routerLink="/profile" (click)="accountPopover.hide()" class="cx-menu__item">
          <i class="pi pi-user" aria-hidden="true"></i> My profile
        </button>
        <button type="button" routerLink="/my-orders" (click)="accountPopover.hide()" class="cx-menu__item">
          <i class="pi pi-receipt" aria-hidden="true"></i> My orders
        </button>
        <button type="button" routerLink="/shop" (click)="accountPopover.hide()" class="cx-menu__item">
          <i class="pi pi-th-large" aria-hidden="true"></i> Continue shopping
        </button>
        <button type="button" class="cx-menu__item cx-menu__item--danger" (click)="logout(accountPopover)">
          <i class="pi pi-sign-out" aria-hidden="true"></i> Sign out
        </button>
      </div>
    }
  </p-popover>
</div>
